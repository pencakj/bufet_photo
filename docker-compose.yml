name: krkonose_live

services:
  krkonose_live:
    build: ./app
    image: krkonose_live:3.0.0
    container_name: krkonose_live
    ports:
      - "8000:8000"
    volumes:
      - /appl/data/bufet/data/images:/app/images
      - /appl/data/bufet/data/thumbnails:/app/thumbnails
      - /appl/data/bufet/data/weather:/app/data
      - /appl/data/krkonose_live_release:/app/camera-data
    environment:
      LEGACY_READ_ONLY: "false"
      WEATHER_POLL_ENABLED: "true"
      COLLECTORS_ENABLED: "true"
      READ_ONLY_MODE: "false"
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s
